name: Update power outage chart

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

jobs:
  update-chart:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update and publish Datawrapper chart
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: python power.py
